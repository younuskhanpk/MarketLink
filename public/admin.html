<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | MarketLink</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="container topbar-inner">
        <div>Fresh produce from trusted local farmers</div>
        <div>Pickup market orders • No delivery • Pay at pickup</div>
      </div>
    </div>

    <header class="header">
      <div class="container navbar">
        <a href="/index.html" class="logo">
          <span class="logo-mark">M</span>
          <span>MarketLink</span>
        </a>
        <nav class="nav-links">
          <a href="/index.html">Home</a>
          <a href="/markets.html">Markets</a>
          <a href="/products.html">Products</a>
        </nav>
        <div class="nav-actions" id="accountSlot"></div>
      </div>
    </header>

    <section class="page-hero">
      <div class="container">
        <div class="kicker">Admin Panel</div>
        <h1>Platform management and analytics dashboard.</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="dashboard-shell">
          <aside class="sidebar">
            <div class="menu-link active">Dashboard</div>
            <div class="menu-link">Farmers</div>
            <div class="menu-link">Customers</div>
            <div class="menu-link">Markets</div>
            <div class="menu-link">Reports</div>
            <div class="menu-link">Categories</div>
            <div class="menu-link">Announcements</div>
          </aside>
          <div class="content-panel" id="adminDashboard"></div>
        </div>
      </div>
    </section>

    <script src="/js/app.js"></script>
  </body>
</html>
