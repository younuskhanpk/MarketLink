<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markets | MarketLink</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="container topbar-inner">
        <div>Fresh produce from trusted local farmers</div>
        <div>Pickup market orders • No delivery • Pay at pickup</div>
      </div>
    </div>

    <header class="header">
      <div class="container navbar">
        <a href="/index.html" class="logo">
          <span class="logo-mark">M</span>
          <span>MarketLink</span>
        </a>
        <nav class="nav-links">
          <a href="/index.html">Home</a>
          <a href="/markets.html">Markets</a>
          <a href="/products.html">Products</a>
          <a href="#">Farmers</a>
          <a href="#">About</a>
        </nav>
        <div class="nav-actions" id="accountSlot"></div>
      </div>
    </header>

    <section class="page-hero">
      <div class="container">
        <div class="kicker">Discover Local Markets</div>
        <h1>Find trusted markets by location, day, and pickup time.</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="controls-wrap">
          <select class="control" aria-label="Location filter">
            <option>Location</option>
            <option>Karachi</option>
            <option>Defence</option>
            <option>North Karachi</option>
          </select>
          <select class="control" aria-label="Day filter">
            <option>Day</option>
            <option>Saturday</option>
            <option>Sunday</option>
            <option>Friday</option>
          </select>
          <input type="text" class="control" placeholder="Search market..." />
        </div>
        <div class="grid-3" id="marketsPage"></div>
      </div>
    </section>

    <div class="modal" id="loginModal">
      <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2>Login</h2>
          <button class="btn btn-secondary close-modal">Close</button>
        </div>
        <form id="loginForm">
          <div class="field"><label>Email</label><input type="email" name="email" required /></div>
          <div class="field" style="margin-top:1rem;"><label>Password</label><input type="password" name="password" required /></div>
          <button class="btn btn-primary" style="width:100%; margin-top:1rem;">Login</button>
        </form>
      </div>
    </div>

    <div class="modal" id="registerModal">
      <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2>Register</h2>
          <button class="btn btn-secondary close-modal">Close</button>
        </div>
        <form id="registerForm">
          <div class="form-grid">
            <div class="field"><label>Full Name</label><input type="text" name="name" required /></div>
            <div class="field"><label>Role</label><select name="role"><option value="customer">Customer</option><option value="farmer">Farmer</option></select></div>
            <div class="field"><label>Email</label><input type="email" name="email" required /></div>
            <div class="field"><label>Phone</label><input type="text" name="phone" /></div>
          </div>
          <div class="field" style="margin-top:1rem;"><label>Address</label><textarea name="address"></textarea></div>
          <div class="field" style="margin-top:1rem;"><label>Password</label><input type="password" name="password" required /></div>
          <button class="btn btn-primary" style="width:100%; margin-top:1rem;">Register</button>
        </form>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
